name = DOOM
author = wup-homebrew / doomgeneric
version = 1.0
description = Classic DOOM for the Wii U GamePad
icon = icon.png            # 64x64 PNG from Photopea

# The engine renders 320x200 with an 8-bit palette; the platform layer scales
# that onto the firmware's own 854x480 8bpp screen, so WUP_BIGMEM stays free
# for the engine's heap. large = yes puts the code in WUP_SPARE (368 KB).
screen8 = yes
large = yes
include = engine
defines = CMAP256 DOOMGENERIC_RESX=320 DOOMGENERIC_RESY=200
# Thumb-1 -Os for the engine so the code fits WUP_SPARE (368 KB); the small
# libwup-facing files stay ARM. Add 'thumb = yes' to shrink further.
thumb_sources = engine/*.c

sources =
    *.c
    engine/*.c
